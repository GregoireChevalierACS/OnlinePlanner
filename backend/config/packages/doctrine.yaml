doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            appointment_id: App\Scheduling\Infrastructure\Persistence\Doctrine\Type\AppointmentIdType
            provider_id: App\Scheduling\Infrastructure\Persistence\Doctrine\Type\ProviderIdType
            appointment_status: App\Scheduling\Infrastructure\Persistence\Doctrine\Type\AppointmentStatusType
            weekly_schedule: App\Scheduling\Infrastructure\Persistence\Doctrine\Type\WeeklyScheduleType
            owner_id: App\Scheduling\Infrastructure\Persistence\Doctrine\Type\OwnerIdType
            account_id: App\Identity\Infrastructure\Persistence\AccountIdType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # Mapping XML hors du domaine : les classes métier ne portent aucun attribut Doctrine (ADR 0001).
            Scheduling:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Scheduling/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Scheduling\Domain'
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Mapping'
                prefix: 'App\Identity\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
