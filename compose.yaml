x-api: &api
  build: ./docker/php
  working_dir: /app
  volumes:
    - ./backend:/app
  environment:
    DATABASE_URL: "postgresql://planner:planner@db:5432/planner?serverVersion=17&charset=utf8"
    # Les e-mails partent vers Mailpit : rien n'est envoyé pour de vrai, tout est visible sur http://localhost:8025
    MAILER_DSN: "smtp://mailpit:1025"
  depends_on:
    db:
      condition: service_healthy

services:
  api:
    <<: *api
    ports:
      - "8000:8000"

  # Traite les messages asynchrones (envoi des e-mails), avec reprises en cas d'échec.
  worker:
    <<: *api
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  db-data:
