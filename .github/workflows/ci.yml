name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier le format des commits
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            git log -1 --format=%s "$sha" > /tmp/msg
            sh .githooks/commit-msg /tmp/msg || { echo "Commit $sha invalide"; exit 1; }
          done

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-retries 10
    env:
      # Base jetable du conteneur CI : identifiants sans valeur hors de ce job.
      DATABASE_URL: postgresql://planner:planner@127.0.0.1:5432/planner?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: pcov
      # Cache des paquets Composer : moins de téléchargements, donc moins de refus « 429 » de GitHub.
      - name: Dossier du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Dépendances PHP
        run: composer install --no-interaction --no-progress
        env:
          # Téléchargements authentifiés auprès de GitHub : limites bien plus hautes qu'en anonyme.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Base de test et migrations
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Mapping et schéma synchronisés
        run: bin/console doctrine:schema:validate --env=test
      - name: Tests et couverture
        run: vendor/bin/phpunit --coverage-clover var/coverage/clover.xml
      - name: Couverture domaine + application = 100 %
        run: php bin/check-coverage.php var/coverage/clover.xml 100
      - name: Tests de mutation domaine + application (MSI >= 80 %)
        run: vendor/bin/infection --threads=max --no-progress

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint . && npx eslint .
      - run: npx prettier --check src/
      - run: npm run type-check
      - name: Tests et couverture (100 % sur api, stores, composables)
        run: npx vitest run --coverage
      - run: npm run build-only
